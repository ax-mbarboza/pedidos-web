name: CI

# Se ejecuta en cada push a main y en cada PR hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos: el pipeline solo lee el repositorio.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.400

      - name: Restaurar paquetes
        run: dotnet restore

      - name: Compilar (sin warnings)
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Ejecutar tests
        run: dotnet test --no-build -c Release
